[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnistate"
version = "1.0.0"
description = "Universal State Governance, Transaction Guardrails & Anti-Bypass Framework for AI Agents, MCP & CLI"
readme = "README.md"
authors = [
    { name = "cwen0224", email = "cwen0224@users.noreply.github.com" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = [
    "ai-agent",
    "mcp",
    "model-context-protocol",
    "guardrails",
    "git-hooks",
    "state-management",
    "code-quality",
    "anti-hallucination",
    "cursor",
    "claude"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0"
]

[project.scripts]
omnistate = "omnistate.cli.main:main"
omnistate-mcp = "omnistate.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["omnistate*"]
